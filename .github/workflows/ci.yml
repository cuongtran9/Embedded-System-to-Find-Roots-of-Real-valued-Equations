# ==============================================================================
# GitHub Actions CI/CD Pipeline
# ==============================================================================

name: CI — Build, Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ── CÁC JOBS ────────────────────────────────────────────────────────────
jobs:

  # ====================================================================
  # Job 1: LINT — Kiểm tra lỗi tiềm ẩn trong C code
  # ====================================================================
  lint:
    name: 🔍 Lint C Code (cppcheck)
    runs-on: ubuntu-latest        # ← Chạy trên máy ảo Ubuntu

    steps:
      # Bước 1: Checkout code từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài cppcheck
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      # Bước 3: Chạy cppcheck trên file C
      - name: Run cppcheck on ESP32 firmware
        run: |
          echo "=== Analyzing main/root32.c ==="
          cppcheck --enable=warning,style,performance \
                   --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   --std=c11 \
                   --xml --xml-version=2 \
                   main/root32.c 2> cppcheck-report.xml || true
          echo "=== cppcheck complete ==="
          cppcheck --enable=warning,style,performance \
                   --suppress=missingIncludeSystem \
                   --std=c11 \
                   main/root32.c

      # Bước 4: Upload report (để xem trên GitHub)
      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck-report.xml

  # ====================================================================
  # Job 2: BUILD — Compile firmware ESP32 bằng ESP-IDF (gcc)
  # ====================================================================

  build:
    name: 🔨 Build ESP32 Firmware (gcc)
    runs-on: ubuntu-latest
    needs: lint                   # ← Chỉ chạy nếu lint pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1
          target: esp32
          path: '.'

      # Lưu firmware.bin để download
      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: build/equation_solver.bin
        if: success()

  # ====================================================================
  # Job 3: TEST — Chạy numerical accuracy tests bằng Python
  # ====================================================================
  test:
    name: 🧪 Numerical Tests (Python)
    runs-on: ubuntu-latest
    needs: lint                   # ← Chạy song song với build (cùng cần lint)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cài Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cài dependencies
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Chạy tests
      # --junit-xml = xuất kết quả dạng XML (CI systems đều đọc được)
      - name: Run numerical accuracy tests
        run: python scripts/run_tests.py --junit-xml test-results.xml

      # Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
